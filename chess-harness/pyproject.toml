[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-chess-harness"
version = "0.1.0"
description = "Local LLM versus chess engine experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11,<2",
    "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chess_harness = ["web/*.html", "web/*.css", "web/*.js"]
